<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandamonium - Visual Data Science Playground</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-tertiary: #0f3460;
      --text-primary: #eee;
      --text-secondary: #aaa;
      --accent: #e94560;
      --accent-hover: #ff6b6b;
      --success: #4ecca3;
      --warning: #ffc107;
      --border: #2a2a4a;
      --code-bg: #0d1117;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }
    .container { display: flex; flex-direction: column; height: 100vh; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo h1 {
      font-size: 1.4rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), #ff9a9e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-controls { display: flex; align-items: center; gap: 12px; }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--bg-tertiary);
      border-radius: 20px;
      font-size: 0.85rem;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--warning);
      animation: pulse 1.5s infinite;
    }
    .status-dot.ready { background: var(--success); animation: none; }
    .status-dot.error { background: var(--accent); animation: none; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    select, button {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
    }
    select:hover, button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); font-weight: 500; }
    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .main-content { display: flex; flex: 1; overflow: hidden; }
    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }
    .panel-tabs { display: flex; gap: 4px; }
    .tab-btn {
      padding: 6px 16px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 4px;
    }
    .tab-btn.active { background: var(--bg-tertiary); color: var(--text-primary); }
    .panel-actions { display: flex; gap: 8px; }
    .icon-btn { padding: 6px 10px; font-size: 1rem; }
    #blocklyDiv { flex: 1; width: 100%; }
    #codeEditor {
      flex: 1;
      width: 100%;
      padding: 16px;
      background: var(--code-bg);
      color: #c9d1d9;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      border: none;
      resize: none;
      display: none;
    }
    .output-panel { width: 45%; display: flex; flex-direction: column; min-width: 300px; }
    .output-tabs {
      display: flex;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }
    .output-tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 500;
      border-bottom: 2px solid transparent;
    }
    .output-tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
    .output-content { flex: 1; overflow: auto; padding: 16px; background: var(--code-bg); }
    #codeOutput, #consoleOutput {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #c9d1d9;
    }
    #consoleOutput { display: none; }
    .output-error { color: #f85149; }
    .output-success { color: #3fb950; }
    .run-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
    }
    .run-info { font-size: 0.85rem; color: var(--text-secondary); }
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 46, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 50px; height: 50px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 20px; font-size: 1.1rem; color: var(--text-secondary); }
    .loading-progress { margin-top: 12px; width: 200px; height: 4px; background: var(--border); border-radius: 2px; }
    .loading-progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Initializing Pyodide...</div>
    <div class="loading-progress">
      <div class="loading-progress-bar" id="loadingBar"></div>
    </div>
  </div>

  <div class="container">
    <header>
      <div class="logo">
        <span style="font-size:1.8rem">🐼</span>
        <h1>Pandamonium</h1>
      </div>
      <div class="header-controls">
        <select id="exampleSelect">
          <option value="">Load Example...</option>
          <option value="explore">Explore Data</option>
          <option value="clean">Clean & Transform</option>
          <option value="classify">Classification</option>
          <option value="regress">Regression</option>
        </select>
        <div class="status-badge">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">Loading...</span>
        </div>
        <button class="primary" id="runBtn" disabled>▶ Run</button>
      </div>
    </header>

    <div class="main-content">
      <div class="editor-panel">
        <div class="panel-header">
          <div class="panel-tabs">
            <button class="tab-btn active" id="blocksTab">Blocks</button>
            <button class="tab-btn" id="codeTab">Code</button>
          </div>
          <div class="panel-actions">
            <button class="icon-btn" id="clearBtn" title="Clear">🗑️</button>
          </div>
        </div>
        <div id="blocklyDiv"></div>
        <textarea id="codeEditor" spellcheck="false"></textarea>
      </div>

      <div class="output-panel">
        <div class="output-tabs">
          <button class="output-tab active" id="outputTab">Output</button>
          <button class="output-tab" id="codeViewTab">Generated Code</button>
        </div>
        <div class="output-content">
          <pre id="consoleOutput"></pre>
          <pre id="codeOutput">Generated Python code will appear here...</pre>
        </div>
        <div class="run-bar">
          <span class="run-info" id="runInfo">Ready</span>
          <button id="copyCodeBtn">📋 Copy Code</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // State
    // ============================================
    const state = {
      pyodide: null,
      workspace: null,
      currentView: 'blocks',
      isRunning: false,
      pyodideReady: false
    };

    // ============================================
    // Colors
    // ============================================
    const COLORS = {
      data: '#E65C00',
      transform: '#FB8C00',
      ml_prep: '#00897B',
      ml_model: '#5C6BC0',
      ml_eval: '#EF5350',
      output: '#8E24AA'
    };

    // ============================================
    // HIGH-LEVEL BLOCK DEFINITIONS
    // ============================================

    // --- DATA LOADING ---
    Blockly.Blocks['load_data'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Load")
          .appendField(new Blockly.FieldDropdown([
            ["CSV", "csv"],
            ["Excel", "excel"],
            ["JSON", "json"],
            ["from URL", "url"]
          ]), "TYPE")
          .appendField("→")
          .appendField(new Blockly.FieldTextInput("df"), "VAR");
        this.appendDummyInput()
          .appendField("Path:")
          .appendField(new Blockly.FieldTextInput("data.csv"), "PATH");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.data);
        this.setTooltip("Load data from file into a DataFrame");
      }
    };

    // --- DATA PREVIEW ---
    Blockly.Blocks['preview_data'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Preview")
          .appendField(new Blockly.FieldTextInput("df"), "VAR")
          .appendField(":")
          .appendField(new Blockly.FieldDropdown([
            ["first rows", "head"],
            ["last rows", "tail"],
            ["statistics", "describe"],
            ["shape", "shape"],
            ["columns", "columns"],
            ["data types", "dtypes"],
            ["info", "info"],
            ["sample", "sample"]
          ]), "TYPE")
          .appendField(new Blockly.FieldNumber(5, 1, 100), "N");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.data);
        this.setTooltip("Preview data in different ways");
      }
    };

    // --- SELECT COLUMNS ---
    Blockly.Blocks['select_columns'] = {
      init: function() {
        this.appendDummyInput()
          .appendField(new Blockly.FieldDropdown([
            ["Keep columns", "keep"],
            ["Drop columns", "drop"]
          ]), "ACTION")
          .appendField("from")
          .appendField(new Blockly.FieldTextInput("df"), "VAR");
        this.appendDummyInput()
          .appendField("Columns:")
          .appendField(new Blockly.FieldTextInput("col1, col2"), "COLUMNS");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.transform);
        this.setTooltip("Keep or drop specific columns");
      }
    };

    // --- FILTER ROWS ---
    Blockly.Blocks['filter_rows'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Filter")
          .appendField(new Blockly.FieldTextInput("df"), "VAR")
          .appendField("where");
        this.appendDummyInput()
          .appendField(new Blockly.FieldTextInput("column"), "COLUMN")
          .appendField(new Blockly.FieldDropdown([
            ["==", "=="],
            ["!=", "!="],
            [">", ">"],
            ["<", "<"],
            [">=", ">="],
            ["<=", "<="],
            ["contains", "contains"],
            ["is null", "isnull"],
            ["not null", "notnull"]
          ]), "OP")
          .appendField(new Blockly.FieldTextInput("value"), "VALUE");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.transform);
        this.setTooltip("Filter rows based on condition");
      }
    };

    // --- HANDLE MISSING ---
    Blockly.Blocks['handle_missing'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Handle missing in")
          .appendField(new Blockly.FieldTextInput("df"), "VAR");
        this.appendDummyInput()
          .appendField(new Blockly.FieldDropdown([
            ["Drop rows with nulls", "drop"],
            ["Fill with value", "value"],
            ["Fill with mean", "mean"],
            ["Fill with median", "median"],
            ["Fill with mode", "mode"],
            ["Forward fill", "ffill"],
            ["Backward fill", "bfill"]
          ]), "METHOD")
          .appendField(new Blockly.FieldTextInput("0"), "FILL_VALUE");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.transform);
        this.setTooltip("Handle missing values");
      }
    };

    // --- SORT DATA ---
    Blockly.Blocks['sort_data'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Sort")
          .appendField(new Blockly.FieldTextInput("df"), "VAR")
          .appendField("by")
          .appendField(new Blockly.FieldTextInput("column"), "COLUMN")
          .appendField(new Blockly.FieldDropdown([
            ["ascending", "True"],
            ["descending", "False"]
          ]), "ORDER");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.transform);
        this.setTooltip("Sort data by column");
      }
    };

    // --- GROUP & SUMMARIZE ---
    Blockly.Blocks['group_summarize'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Group")
          .appendField(new Blockly.FieldTextInput("df"), "VAR")
          .appendField("by")
          .appendField(new Blockly.FieldTextInput("group_col"), "GROUP_COL");
        this.appendDummyInput()
          .appendField("Calc")
          .appendField(new Blockly.FieldDropdown([
            ["sum", "sum"],
            ["mean", "mean"],
            ["count", "count"],
            ["min", "min"],
            ["max", "max"],
            ["median", "median"],
            ["std", "std"]
          ]), "AGG")
          .appendField("of")
          .appendField(new Blockly.FieldTextInput("value_col"), "VALUE_COL")
          .appendField("→")
          .appendField(new Blockly.FieldTextInput("result"), "RESULT_VAR");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.transform);
        this.setTooltip("Group by column and aggregate");
      }
    };

    // --- MERGE DATA ---
    Blockly.Blocks['merge_data'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Merge")
          .appendField(new Blockly.FieldTextInput("df1"), "LEFT")
          .appendField("with")
          .appendField(new Blockly.FieldTextInput("df2"), "RIGHT");
        this.appendDummyInput()
          .appendField("On:")
          .appendField(new Blockly.FieldTextInput("key"), "ON")
          .appendField("How:")
          .appendField(new Blockly.FieldDropdown([
            ["inner", "inner"],
            ["left", "left"],
            ["right", "right"],
            ["outer", "outer"]
          ]), "HOW")
          .appendField("→")
          .appendField(new Blockly.FieldTextInput("merged"), "RESULT");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.transform);
        this.setTooltip("Merge two DataFrames");
      }
    };

    // --- PREPARE FEATURES (ML) ---
    Blockly.Blocks['prepare_features'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Prepare ML data from")
          .appendField(new Blockly.FieldTextInput("df"), "VAR");
        this.appendDummyInput()
          .appendField("Features:")
          .appendField(new Blockly.FieldTextInput("col1, col2, col3"), "FEATURES");
        this.appendDummyInput()
          .appendField("Target:")
          .appendField(new Blockly.FieldTextInput("target"), "TARGET");
        this.appendDummyInput()
          .appendField("→ X:")
          .appendField(new Blockly.FieldTextInput("X"), "X_VAR")
          .appendField("y:")
          .appendField(new Blockly.FieldTextInput("y"), "Y_VAR");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.ml_prep);
        this.setTooltip("Extract features (X) and target (y) for ML");
      }
    };

    // --- SPLIT DATA ---
    Blockly.Blocks['split_data'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Split")
          .appendField(new Blockly.FieldTextInput("X"), "X_VAR")
          .appendField(",")
          .appendField(new Blockly.FieldTextInput("y"), "Y_VAR")
          .appendField("test:")
          .appendField(new Blockly.FieldNumber(0.2, 0.1, 0.5, 0.05), "TEST_SIZE");
        this.appendDummyInput()
          .appendField("→ X_train, X_test, y_train, y_test");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.ml_prep);
        this.setTooltip("Split into train and test sets");
      }
    };

    // --- SCALE FEATURES ---
    Blockly.Blocks['scale_features'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Scale features")
          .appendField(new Blockly.FieldDropdown([
            ["StandardScaler (z-score)", "standard"],
            ["MinMaxScaler (0-1)", "minmax"],
            ["RobustScaler (outliers)", "robust"]
          ]), "SCALER");
        this.appendDummyInput()
          .appendField("Fit on X_train, transform X_train & X_test");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.ml_prep);
        this.setTooltip("Scale/normalize features");
      }
    };

    // --- CREATE MODEL ---
    Blockly.Blocks['create_model'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Create")
          .appendField(new Blockly.FieldDropdown([
            ["Linear Regression", "linear_reg"],
            ["Logistic Regression", "logistic_reg"],
            ["Decision Tree", "decision_tree"],
            ["Random Forest", "random_forest"],
            ["KNN", "knn"],
            ["SVM", "svm"],
            ["Naive Bayes", "naive_bayes"],
            ["Gradient Boosting", "gradient_boost"]
          ]), "MODEL_TYPE")
          .appendField("→")
          .appendField(new Blockly.FieldTextInput("model"), "MODEL_VAR");
        this.appendDummyInput()
          .appendField("Task:")
          .appendField(new Blockly.FieldDropdown([
            ["Classification", "classifier"],
            ["Regression", "regressor"]
          ]), "TASK");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.ml_model);
        this.setTooltip("Create an ML model");
      }
    };

    // --- TRAIN MODEL ---
    Blockly.Blocks['train_model'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Train")
          .appendField(new Blockly.FieldTextInput("model"), "MODEL_VAR")
          .appendField("on X_train, y_train");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.ml_model);
        this.setTooltip("Train the model on training data");
      }
    };

    // --- PREDICT ---
    Blockly.Blocks['predict'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Predict with")
          .appendField(new Blockly.FieldTextInput("model"), "MODEL_VAR")
          .appendField("on")
          .appendField(new Blockly.FieldDropdown([
            ["X_test", "X_test"],
            ["X_train", "X_train"],
            ["X", "X"]
          ]), "DATA")
          .appendField("→")
          .appendField(new Blockly.FieldTextInput("y_pred"), "PRED_VAR");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.ml_model);
        this.setTooltip("Make predictions");
      }
    };

    // --- GRID SEARCH ---
    Blockly.Blocks['grid_search'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Grid Search")
          .appendField(new Blockly.FieldTextInput("model"), "MODEL_VAR");
        this.appendDummyInput()
          .appendField("Params:")
          .appendField(new Blockly.FieldTextInput("n_estimators: [50,100], max_depth: [3,5,10]"), "PARAMS");
        this.appendDummyInput()
          .appendField("CV folds:")
          .appendField(new Blockly.FieldNumber(5, 2, 10), "CV")
          .appendField("Scoring:")
          .appendField(new Blockly.FieldDropdown([
            ["accuracy", "accuracy"],
            ["f1", "f1"],
            ["precision", "precision"],
            ["recall", "recall"],
            ["r2", "r2"],
            ["neg_mse", "neg_mean_squared_error"]
          ]), "SCORING");
        this.appendDummyInput()
          .appendField("→ best model in")
          .appendField(new Blockly.FieldTextInput("model"), "BEST_VAR");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.ml_model);
        this.setTooltip("Find best hyperparameters with grid search");
      }
    };

    // --- CROSS VALIDATE ---
    Blockly.Blocks['cross_validate'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Cross-validate")
          .appendField(new Blockly.FieldTextInput("model"), "MODEL_VAR")
          .appendField("folds:")
          .appendField(new Blockly.FieldNumber(5, 2, 10), "CV");
        this.appendDummyInput()
          .appendField("Print mean score ± std");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.ml_eval);
        this.setTooltip("Evaluate with cross-validation");
      }
    };

    // --- EVALUATE ---
    Blockly.Blocks['evaluate'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("Evaluate:")
          .appendField(new Blockly.FieldDropdown([
            ["Accuracy", "accuracy"],
            ["Precision", "precision"],
            ["Recall", "recall"],
            ["F1 Score", "f1"],
            ["Confusion Matrix", "confusion"],
            ["Classification Report", "class_report"],
            ["MSE", "mse"],
            ["RMSE", "rmse"],
            ["MAE", "mae"],
            ["R² Score", "r2"]
          ]), "METRIC");
        this.appendDummyInput()
          .appendField("y_true:")
          .appendField(new Blockly.FieldDropdown([
            ["y_test", "y_test"],
            ["y_train", "y_train"],
            ["y", "y"]
          ]), "Y_TRUE")
          .appendField("y_pred:")
          .appendField(new Blockly.FieldTextInput("y_pred"), "Y_PRED");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.ml_eval);
        this.setTooltip("Calculate evaluation metric");
      }
    };

    // --- OUTPUT ---
    Blockly.Blocks['output'] = {
      init: function() {
        this.appendDummyInput()
          .appendField(new Blockly.FieldDropdown([
            ["Print", "print"],
            ["Save as CSV", "csv"],
            ["Save as Excel", "excel"]
          ]), "TYPE")
          .appendField(new Blockly.FieldTextInput("df"), "VAR");
        this.appendDummyInput()
          .appendField("Path:")
          .appendField(new Blockly.FieldTextInput("output.csv"), "PATH");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(COLORS.output);
        this.setTooltip("Output data");
      }
    };

    // --- COMMENT ---
    Blockly.Blocks['comment'] = {
      init: function() {
        this.appendDummyInput()
          .appendField("#")
          .appendField(new Blockly.FieldTextInput("comment"), "TEXT");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(160);
        this.setTooltip("Add a comment");
      }
    };

    // ============================================
    // CODE GENERATORS
    // ============================================
    const pythonGenerator = new Blockly.Generator('Python');
    pythonGenerator.INDENT = '    ';
    const imports = new Set();

    function addImport(imp) { imports.add(imp); }

    pythonGenerator.forBlock['load_data'] = function(block) {
      addImport('import pandas as pd');
      const type = block.getFieldValue('TYPE');
      const varName = block.getFieldValue('VAR');
      const path = block.getFieldValue('PATH');

      let code = '';
      if (type === 'csv' || type === 'url') {
        code = `${varName} = pd.read_csv("${path}")\n`;
      } else if (type === 'excel') {
        code = `${varName} = pd.read_excel("${path}")\n`;
      } else if (type === 'json') {
        code = `${varName} = pd.read_json("${path}")\n`;
      }
      return code;
    };

    pythonGenerator.forBlock['preview_data'] = function(block) {
      const varName = block.getFieldValue('VAR');
      const type = block.getFieldValue('TYPE');
      const n = block.getFieldValue('N');

      let code = '';
      if (type === 'head') code = `print(${varName}.head(${n}))\n`;
      else if (type === 'tail') code = `print(${varName}.tail(${n}))\n`;
      else if (type === 'describe') code = `print(${varName}.describe())\n`;
      else if (type === 'shape') code = `print(f"Shape: {${varName}.shape}")\n`;
      else if (type === 'columns') code = `print(f"Columns: {${varName}.columns.tolist()}")\n`;
      else if (type === 'dtypes') code = `print(${varName}.dtypes)\n`;
      else if (type === 'info') code = `print(${varName}.info())\n`;
      else if (type === 'sample') code = `print(${varName}.sample(${n}))\n`;
      return code;
    };

    pythonGenerator.forBlock['select_columns'] = function(block) {
      const action = block.getFieldValue('ACTION');
      const varName = block.getFieldValue('VAR');
      const columns = block.getFieldValue('COLUMNS').split(',').map(c => `"${c.trim()}"`).join(', ');

      if (action === 'keep') {
        return `${varName} = ${varName}[[${columns}]]\n`;
      } else {
        return `${varName} = ${varName}.drop(columns=[${columns}])\n`;
      }
    };

    pythonGenerator.forBlock['filter_rows'] = function(block) {
      const varName = block.getFieldValue('VAR');
      const column = block.getFieldValue('COLUMN');
      const op = block.getFieldValue('OP');
      const value = block.getFieldValue('VALUE');

      let code = '';
      if (op === 'isnull') {
        code = `${varName} = ${varName}[${varName}["${column}"].isnull()]\n`;
      } else if (op === 'notnull') {
        code = `${varName} = ${varName}[${varName}["${column}"].notnull()]\n`;
      } else if (op === 'contains') {
        code = `${varName} = ${varName}[${varName}["${column}"].str.contains("${value}", na=False)]\n`;
      } else {
        const val = isNaN(value) ? `"${value}"` : value;
        code = `${varName} = ${varName}[${varName}["${column}"] ${op} ${val}]\n`;
      }
      return code;
    };

    pythonGenerator.forBlock['handle_missing'] = function(block) {
      const varName = block.getFieldValue('VAR');
      const method = block.getFieldValue('METHOD');
      const fillValue = block.getFieldValue('FILL_VALUE');

      let code = '';
      if (method === 'drop') {
        code = `${varName} = ${varName}.dropna()\n`;
      } else if (method === 'value') {
        const val = isNaN(fillValue) ? `"${fillValue}"` : fillValue;
        code = `${varName} = ${varName}.fillna(${val})\n`;
      } else if (method === 'mean') {
        code = `${varName} = ${varName}.fillna(${varName}.mean(numeric_only=True))\n`;
      } else if (method === 'median') {
        code = `${varName} = ${varName}.fillna(${varName}.median(numeric_only=True))\n`;
      } else if (method === 'mode') {
        code = `${varName} = ${varName}.fillna(${varName}.mode().iloc[0])\n`;
      } else if (method === 'ffill') {
        code = `${varName} = ${varName}.ffill()\n`;
      } else if (method === 'bfill') {
        code = `${varName} = ${varName}.bfill()\n`;
      }
      return code;
    };

    pythonGenerator.forBlock['sort_data'] = function(block) {
      const varName = block.getFieldValue('VAR');
      const column = block.getFieldValue('COLUMN');
      const order = block.getFieldValue('ORDER');
      return `${varName} = ${varName}.sort_values("${column}", ascending=${order})\n`;
    };

    pythonGenerator.forBlock['group_summarize'] = function(block) {
      const varName = block.getFieldValue('VAR');
      const groupCol = block.getFieldValue('GROUP_COL');
      const agg = block.getFieldValue('AGG');
      const valueCol = block.getFieldValue('VALUE_COL');
      const resultVar = block.getFieldValue('RESULT_VAR');
      return `${resultVar} = ${varName}.groupby("${groupCol}")["${valueCol}"].${agg}().reset_index()\nprint(${resultVar})\n`;
    };

    pythonGenerator.forBlock['merge_data'] = function(block) {
      addImport('import pandas as pd');
      const left = block.getFieldValue('LEFT');
      const right = block.getFieldValue('RIGHT');
      const on = block.getFieldValue('ON');
      const how = block.getFieldValue('HOW');
      const result = block.getFieldValue('RESULT');
      return `${result} = pd.merge(${left}, ${right}, on="${on}", how="${how}")\n`;
    };

    pythonGenerator.forBlock['prepare_features'] = function(block) {
      const varName = block.getFieldValue('VAR');
      const features = block.getFieldValue('FEATURES').split(',').map(c => `"${c.trim()}"`).join(', ');
      const target = block.getFieldValue('TARGET');
      const xVar = block.getFieldValue('X_VAR');
      const yVar = block.getFieldValue('Y_VAR');
      return `${xVar} = ${varName}[[${features}]]\n${yVar} = ${varName}["${target}"]\n`;
    };

    pythonGenerator.forBlock['split_data'] = function(block) {
      addImport('from sklearn.model_selection import train_test_split');
      const xVar = block.getFieldValue('X_VAR');
      const yVar = block.getFieldValue('Y_VAR');
      const testSize = block.getFieldValue('TEST_SIZE');
      return `X_train, X_test, y_train, y_test = train_test_split(${xVar}, ${yVar}, test_size=${testSize}, random_state=42)\n`;
    };

    pythonGenerator.forBlock['scale_features'] = function(block) {
      const scaler = block.getFieldValue('SCALER');
      let scalerClass = 'StandardScaler';
      if (scaler === 'minmax') scalerClass = 'MinMaxScaler';
      else if (scaler === 'robust') scalerClass = 'RobustScaler';
      addImport(`from sklearn.preprocessing import ${scalerClass}`);
      return `scaler = ${scalerClass}()\nX_train = scaler.fit_transform(X_train)\nX_test = scaler.transform(X_test)\n`;
    };

    pythonGenerator.forBlock['create_model'] = function(block) {
      const modelType = block.getFieldValue('MODEL_TYPE');
      const task = block.getFieldValue('TASK');
      const modelVar = block.getFieldValue('MODEL_VAR');

      let code = '';
      if (modelType === 'linear_reg') {
        addImport('from sklearn.linear_model import LinearRegression');
        code = `${modelVar} = LinearRegression()\n`;
      } else if (modelType === 'logistic_reg') {
        addImport('from sklearn.linear_model import LogisticRegression');
        code = `${modelVar} = LogisticRegression(max_iter=1000)\n`;
      } else if (modelType === 'decision_tree') {
        if (task === 'classifier') {
          addImport('from sklearn.tree import DecisionTreeClassifier');
          code = `${modelVar} = DecisionTreeClassifier(random_state=42)\n`;
        } else {
          addImport('from sklearn.tree import DecisionTreeRegressor');
          code = `${modelVar} = DecisionTreeRegressor(random_state=42)\n`;
        }
      } else if (modelType === 'random_forest') {
        if (task === 'classifier') {
          addImport('from sklearn.ensemble import RandomForestClassifier');
          code = `${modelVar} = RandomForestClassifier(n_estimators=100, random_state=42)\n`;
        } else {
          addImport('from sklearn.ensemble import RandomForestRegressor');
          code = `${modelVar} = RandomForestRegressor(n_estimators=100, random_state=42)\n`;
        }
      } else if (modelType === 'knn') {
        if (task === 'classifier') {
          addImport('from sklearn.neighbors import KNeighborsClassifier');
          code = `${modelVar} = KNeighborsClassifier(n_neighbors=5)\n`;
        } else {
          addImport('from sklearn.neighbors import KNeighborsRegressor');
          code = `${modelVar} = KNeighborsRegressor(n_neighbors=5)\n`;
        }
      } else if (modelType === 'svm') {
        if (task === 'classifier') {
          addImport('from sklearn.svm import SVC');
          code = `${modelVar} = SVC(random_state=42)\n`;
        } else {
          addImport('from sklearn.svm import SVR');
          code = `${modelVar} = SVR()\n`;
        }
      } else if (modelType === 'naive_bayes') {
        addImport('from sklearn.naive_bayes import GaussianNB');
        code = `${modelVar} = GaussianNB()\n`;
      } else if (modelType === 'gradient_boost') {
        if (task === 'classifier') {
          addImport('from sklearn.ensemble import GradientBoostingClassifier');
          code = `${modelVar} = GradientBoostingClassifier(random_state=42)\n`;
        } else {
          addImport('from sklearn.ensemble import GradientBoostingRegressor');
          code = `${modelVar} = GradientBoostingRegressor(random_state=42)\n`;
        }
      }
      return code;
    };

    pythonGenerator.forBlock['train_model'] = function(block) {
      const modelVar = block.getFieldValue('MODEL_VAR');
      return `${modelVar}.fit(X_train, y_train)\nprint(f"Model trained: {type(${modelVar}).__name__}")\n`;
    };

    pythonGenerator.forBlock['predict'] = function(block) {
      const modelVar = block.getFieldValue('MODEL_VAR');
      const data = block.getFieldValue('DATA');
      const predVar = block.getFieldValue('PRED_VAR');
      return `${predVar} = ${modelVar}.predict(${data})\n`;
    };

    pythonGenerator.forBlock['grid_search'] = function(block) {
      addImport('from sklearn.model_selection import GridSearchCV');
      const modelVar = block.getFieldValue('MODEL_VAR');
      const paramsStr = block.getFieldValue('PARAMS');
      const cv = block.getFieldValue('CV');
      const scoring = block.getFieldValue('SCORING');
      const bestVar = block.getFieldValue('BEST_VAR');

      // Parse params string like "n_estimators: [50,100], max_depth: [3,5]"
      const params = paramsStr.split(',').map(p => {
        const [key, val] = p.split(':').map(s => s.trim());
        return `"${key}": ${val}`;
      }).join(', ');

      return `param_grid = {${params}}\ngrid_search = GridSearchCV(${modelVar}, param_grid, cv=${cv}, scoring="${scoring}")\ngrid_search.fit(X_train, y_train)\n${bestVar} = grid_search.best_estimator_\nprint(f"Best params: {grid_search.best_params_}")\nprint(f"Best score: {grid_search.best_score_:.4f}")\n`;
    };

    pythonGenerator.forBlock['cross_validate'] = function(block) {
      addImport('from sklearn.model_selection import cross_val_score');
      addImport('import numpy as np');
      const modelVar = block.getFieldValue('MODEL_VAR');
      const cv = block.getFieldValue('CV');
      return `cv_scores = cross_val_score(${modelVar}, X_train, y_train, cv=${cv})\nprint(f"CV Score: {cv_scores.mean():.4f} (+/- {cv_scores.std()*2:.4f})")\n`;
    };

    pythonGenerator.forBlock['evaluate'] = function(block) {
      const metric = block.getFieldValue('METRIC');
      const yTrue = block.getFieldValue('Y_TRUE');
      const yPred = block.getFieldValue('Y_PRED');

      let code = '';
      if (metric === 'accuracy') {
        addImport('from sklearn.metrics import accuracy_score');
        code = `print(f"Accuracy: {accuracy_score(${yTrue}, ${yPred}):.4f}")\n`;
      } else if (metric === 'precision') {
        addImport('from sklearn.metrics import precision_score');
        code = `print(f"Precision: {precision_score(${yTrue}, ${yPred}, average='weighted'):.4f}")\n`;
      } else if (metric === 'recall') {
        addImport('from sklearn.metrics import recall_score');
        code = `print(f"Recall: {recall_score(${yTrue}, ${yPred}, average='weighted'):.4f}")\n`;
      } else if (metric === 'f1') {
        addImport('from sklearn.metrics import f1_score');
        code = `print(f"F1 Score: {f1_score(${yTrue}, ${yPred}, average='weighted'):.4f}")\n`;
      } else if (metric === 'confusion') {
        addImport('from sklearn.metrics import confusion_matrix');
        code = `print("Confusion Matrix:")\nprint(confusion_matrix(${yTrue}, ${yPred}))\n`;
      } else if (metric === 'class_report') {
        addImport('from sklearn.metrics import classification_report');
        code = `print("Classification Report:")\nprint(classification_report(${yTrue}, ${yPred}))\n`;
      } else if (metric === 'mse') {
        addImport('from sklearn.metrics import mean_squared_error');
        code = `print(f"MSE: {mean_squared_error(${yTrue}, ${yPred}):.4f}")\n`;
      } else if (metric === 'rmse') {
        addImport('from sklearn.metrics import mean_squared_error');
        addImport('import numpy as np');
        code = `print(f"RMSE: {np.sqrt(mean_squared_error(${yTrue}, ${yPred})):.4f}")\n`;
      } else if (metric === 'mae') {
        addImport('from sklearn.metrics import mean_absolute_error');
        code = `print(f"MAE: {mean_absolute_error(${yTrue}, ${yPred}):.4f}")\n`;
      } else if (metric === 'r2') {
        addImport('from sklearn.metrics import r2_score');
        code = `print(f"R² Score: {r2_score(${yTrue}, ${yPred}):.4f}")\n`;
      }
      return code;
    };

    pythonGenerator.forBlock['output'] = function(block) {
      const type = block.getFieldValue('TYPE');
      const varName = block.getFieldValue('VAR');
      const path = block.getFieldValue('PATH');

      if (type === 'print') {
        return `print(${varName})\n`;

        return `${varName}.to_excel("${path}", index=False)\nprint(f"Saved to ${path}")\n`;

    };

    pythonGenerator.forBlock['comment'] = function(block) {

    pythonGenerator.scrub_ = function(block, code, thisOnly) {
      const nextBlock = block.nextConnection && block.nextConnection.targetBlock();
      if (nextBlock && !thisOnly) {
        return code + pythonGenerator.blockToCode(nextBlock);
      }
      return code;
    };

    async function initPyodide() {

        script.src = 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js';
        document.head.appendChild(script);
        await new Promise((resolve, reject) => { script.onload = resolve; script.onerror = reject; });

        setLoadingProgress(30, 'Initializing Python...');
        state.pyodide = await loadPyodide();

        setLoadingProgress(50, 'Installing pandas...');
        await state.pyodide.loadPackage('pandas');

        setLoadingProgress(70, 'Installing scikit-learn...');
        await state.pyodide.loadPackage('scikit-learn');

        setLoadingProgress(100, 'Ready!');
        state.pyodideReady = true;
        elements.statusDot.classList.add('ready');
        elements.statusText.textContent = 'Ready';
        elements.runBtn.disabled = false;

        setTimeout(() => elements.loadingOverlay.classList.add('hidden'), 500);
      } catch (error) {
        elements.statusDot.classList.add('error');
        elements.statusText.textContent = 'Error';
        elements.loadingText.textContent = 'Failed to load Python';
      }
    }

    function setLoadingProgress(percent, text) {
      elements.loadingBar.style.width = percent + '%';
      elements.loadingText.textContent = text;
    }

    // ============================================
    // RUN CODE
    // ============================================
    async function runCode() {
      if (!state.pyodideReady || state.isRunning) return;
      state.isRunning = true;
      elements.runBtn.disabled = true;
      elements.runInfo.textContent = 'Running...';
      elements.consoleOutput.innerHTML = '';

      const code = state.currentView === 'blocks' ? generateCode() : elements.codeEditor.value;

      try {
        state.pyodide.setStdout({ batched: (text) => { elements.consoleOutput.innerHTML += text + '\n'; } });
        state.pyodide.setStderr({ batched: (text) => { elements.consoleOutput.innerHTML += `<span class="output-error">${text}</span>\n`; } });

        await state.pyodide.runPythonAsync(code);
        elements.consoleOutput.innerHTML += '<span class="output-success">\n✓ Done</span>';
        elements.runInfo.textContent = 'Completed';
      } catch (error) {
        elements.consoleOutput.innerHTML += `<span class="output-error">\n✗ ${error.message}</span>`;
        elements.runInfo.textContent = 'Error';
      }

      state.isRunning = false;
      elements.runBtn.disabled = false;
      elements.outputTab.classList.add('active');
      elements.codeViewTab.classList.remove('active');
      elements.consoleOutput.style.display = 'block';
      elements.codeOutput.style.display = 'none';
    }

    // ============================================
    // EVENT HANDLERS
    // ============================================
    elements.runBtn.addEventListener('click', runCode);

    elements.blocksTab.addEventListener('click', () => {
      state.currentView = 'blocks';
      elements.blocksTab.classList.add('active');
      elements.codeTab.classList.remove('active');
      elements.blocklyDiv.style.display = 'block';
      elements.codeEditor.style.display = 'none';
    });

    elements.codeTab.addEventListener('click', () => {
      state.currentView = 'code';
      elements.codeTab.classList.add('active');
      elements.blocksTab.classList.remove('active');
      elements.blocklyDiv.style.display = 'none';
      elements.codeEditor.style.display = 'block';
    });

    elements.outputTab.addEventListener('click', () => {
      elements.outputTab.classList.add('active');
      elements.codeViewTab.classList.remove('active');
      elements.consoleOutput.style.display = 'block';
      elements.codeOutput.style.display = 'none';
    });

    elements.codeViewTab.addEventListener('click', () => {
      elements.codeViewTab.classList.add('active');
      elements.outputTab.classList.remove('active');
      elements.codeOutput.style.display = 'block';
      elements.consoleOutput.style.display = 'none';
    });

    elements.exampleSelect.addEventListener('change', (e) => {
      if (e.target.value && examples[e.target.value]) {
        state.workspace.clear();
        Blockly.serialization.workspaces.load(examples[e.target.value], state.workspace);
        e.target.value = '';
        updateCode();
      }
    });

    elements.copyCodeBtn.addEventListener('click', () => {
      const code = state.currentView === 'blocks' ? generateCode() : elements.codeEditor.value;
      navigator.clipboard.writeText(code).then(() => {
        elements.copyCodeBtn.textContent = '✓ Copied!';
        setTimeout(() => elements.copyCodeBtn.textContent = '📋 Copy Code', 2000);
      });
    });

    elements.clearBtn.addEventListener('click', () => {
      if (confirm('Clear all blocks?')) state.workspace.clear();
    });

    window.addEventListener('resize', () => Blockly.svgResize(state.workspace));

    // ============================================
    // INIT
    // ============================================
    initBlockly();
    initPyodide();
  </script>
</body>
</html>
