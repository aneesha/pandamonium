<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandamonium - Clustering Example</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="../dist/pandamonium.umd.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; color: #e94560; }
    p { margin-bottom: 20px; color: #aaa; }
    .container {
      display: flex;
      gap: 20px;
      height: calc(100vh - 120px);
    }
    #blocklyDiv {
      flex: 1;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      overflow: hidden;
    }
    .code-panel {
      width: 450px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    h3 { color: #4ecca3; margin-bottom: 10px; }
    pre {
      flex: 1;
      background: #0d1117;
      padding: 16px;
      border-radius: 8px;
      overflow: auto;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 20px;
      background: #AB47BC;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #CE93D8; }
  </style>
</head>
<body>
  <h1>🐼 Clustering Example</h1>
  <p>This example demonstrates K-Means clustering with PCA for dimensionality reduction.</p>

  <div class="container">
    <div id="blocklyDiv"></div>
    <div class="code-panel">
      <h3>Generated Python Code</h3>
      <pre id="codeOutput">Loading example...</pre>
      <div class="actions">
        <button onclick="copyCode()">📋 Copy Code</button>
        <button onclick="clearWorkspace()">🗑️ Clear</button>
      </div>
    </div>
  </div>

  <script>
    const pandamonium = new Pandamonium.Pandamonium({
      container: document.getElementById('blocklyDiv')
    });

    pandamonium.onChange((code) => {
      document.getElementById('codeOutput').textContent = code || '# No blocks yet...';
    });

    // Clustering example
    const clusteringExample = {
      blocks: {
        languageVersion: 0,
        blocks: [
          {
            type: 'comment_block',
            x: 50,
            y: 30,
            fields: { COMMENT: 'K-Means Clustering with PCA' },
            next: {
              block: {
                type: 'pandas_set_dataframe',
                fields: { VAR: 'df' },
                inputs: {
                  VALUE: {
                    block: {
                      type: 'pandas_read_csv',
                      inputs: {
                        PATH: { block: { type: 'text_value', fields: { TEXT: 'customers.csv' } } }
                      }
                    }
                  }
                },
                next: {
                  block: {
                    type: 'comment_block',
                    fields: { COMMENT: 'Select numeric features' },
                    next: {
                      block: {
                        type: 'var_set',
                        fields: { VAR: 'X' },
                        inputs: {
                          VALUE: {
                            block: {
                              type: 'pandas_select_columns',
                              inputs: {
                                COLUMNS: { block: { type: 'array_create_with', fields: { ITEMS: 'age, income, spending_score' } } },
                                DATAFRAME: { block: { type: 'pandas_dataframe_var', fields: { VAR: 'df' } } }
                              }
                            }
                          }
                        },
                        next: {
                          block: {
                            type: 'comment_block',
                            fields: { COMMENT: 'Scale features' },
                            next: {
                              block: {
                                type: 'sklearn_set_model',
                                fields: { VAR: 'scaler' },
                                inputs: {
                                  VALUE: { block: { type: 'sklearn_standard_scaler' } }
                                },
                                next: {
                                  block: {
                                    type: 'var_set',
                                    fields: { VAR: 'X_scaled' },
                                    inputs: {
                                      VALUE: {
                                        block: {
                                          type: 'sklearn_fit_transform',
                                          inputs: {
                                            DATA: { block: { type: 'var_get', fields: { VAR: 'X' } } },
                                            TRANSFORMER: { block: { type: 'sklearn_model_var', fields: { VAR: 'scaler' } } }
                                          }
                                        }
                                      }
                                    },
                                    next: {
                                      block: {
                                        type: 'comment_block',
                                        fields: { COMMENT: 'Reduce to 2D with PCA' },
                                        next: {
                                          block: {
                                            type: 'sklearn_set_model',
                                            fields: { VAR: 'pca' },
                                            inputs: {
                                              VALUE: { block: { type: 'sklearn_pca', fields: { N_COMPONENTS: 2 } } }
                                            },
                                            next: {
                                              block: {
                                                type: 'var_set',
                                                fields: { VAR: 'X_pca' },
                                                inputs: {
                                                  VALUE: {
                                                    block: {
                                                      type: 'sklearn_fit_transform',
                                                      inputs: {
                                                        DATA: { block: { type: 'var_get', fields: { VAR: 'X_scaled' } } },
                                                        TRANSFORMER: { block: { type: 'sklearn_model_var', fields: { VAR: 'pca' } } }
                                                      }
                                                    }
                                                  }
                                                },
                                                next: {
                                                  block: {
                                                    type: 'comment_block',
                                                    fields: { COMMENT: 'Apply K-Means clustering' },
                                                    next: {
                                                      block: {
                                                        type: 'sklearn_set_model',
                                                        fields: { VAR: 'kmeans' },
                                                        inputs: {
                                                          VALUE: { block: { type: 'sklearn_kmeans', fields: { N_CLUSTERS: 4, RANDOM_STATE: 42 } } }
                                                        },
                                                        next: {
                                                          block: {
                                                            type: 'var_set',
                                                            fields: { VAR: 'clusters' },
                                                            inputs: {
                                                              VALUE: {
                                                                block: {
                                                                  type: 'sklearn_predict',
                                                                  inputs: {
                                                                    MODEL: {
                                                                      block: {
                                                                        type: 'sklearn_fit',
                                                                        inputs: {
                                                                          MODEL: { block: { type: 'sklearn_model_var', fields: { VAR: 'kmeans' } } },
                                                                          X: { block: { type: 'var_get', fields: { VAR: 'X_pca' } } },
                                                                          Y: { block: { type: 'var_get', fields: { VAR: 'X_pca' } } }
                                                                        }
                                                                      }
                                                                    },
                                                                    X: { block: { type: 'var_get', fields: { VAR: 'X_pca' } } }
                                                                  }
                                                                }
                                                              }
                                                            },
                                                            next: {
                                                              block: {
                                                                type: 'comment_block',
                                                                fields: { COMMENT: 'Print cluster assignments' },
                                                                next: {
                                                                  block: {
                                                                    type: 'pandas_print',
                                                                    inputs: {
                                                                      VALUE: { block: { type: 'var_get', fields: { VAR: 'clusters' } } }
                                                                    }
                                                                  }
                                                                }
                                                              }
                                                            }
                                                          }
                                                        }
                                                      }
                                                    }
                                                  }
                                                }
                                              }
                                            }
                                          }
                                        }
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        ]
      }
    };

    pandamonium.loadWorkspace(clusteringExample);

    function copyCode() {
      const code = pandamonium.generateCode();
      navigator.clipboard.writeText(code);
      alert('Code copied to clipboard!');
    }

    function clearWorkspace() {
      pandamonium.clearWorkspace();
    }
  </script>
</body>
</html>
