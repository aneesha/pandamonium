<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandamonium - Data Cleaning & Transformation</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="../dist/pandamonium.umd.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; color: #e94560; }
    p { margin-bottom: 20px; color: #aaa; }
    .container {
      display: flex;
      gap: 20px;
      height: calc(100vh - 120px);
    }
    #blocklyDiv {
      flex: 1;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      overflow: hidden;
    }
    .code-panel {
      width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    h3 { color: #4ecca3; margin-bottom: 10px; }
    pre {
      flex: 1;
      background: #0d1117;
      padding: 16px;
      border-radius: 8px;
      overflow: auto;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 20px;
      background: #FB8C00;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #FF9800; }
  </style>
</head>
<body>
  <h1>🐼 Data Cleaning & Transformation Example</h1>
  <p>This example demonstrates data cleaning and transformation operations using the simplified high-level blocks.</p>

  <div class="container">
    <div id="blocklyDiv"></div>
    <div class="code-panel">
      <h3>Generated Python Code</h3>
      <pre id="codeOutput">Loading example...</pre>
      <div class="actions">
        <button onclick="copyCode()">📋 Copy Code</button>
        <button onclick="clearWorkspace()">🗑️ Clear</button>
      </div>
    </div>
  </div>

  <script>
    const pandamonium = new Pandamonium.Pandamonium({
      container: document.getElementById('blocklyDiv')
    });

    pandamonium.onChange((code) => {
      document.getElementById('codeOutput').textContent = code || '# No blocks yet...';
    });

    // Data cleaning example with new high-level blocks
    const cleaningExample = {
      blocks: {
        languageVersion: 0,
        blocks: [{
          type: 'comment', x: 50, y: 30, fields: { TEXT: 'Data Cleaning: Titanic dataset' },
          next: { block: {
            type: 'load_data', fields: { TYPE: 'url', VAR: 'df', PATH: 'https://raw.githubusercontent.com/mwaskom/seaborn-data/master/titanic.csv' },
            next: { block: {
              type: 'preview_data', fields: { VAR: 'df', TYPE: 'shape', N: 5 },
              next: { block: {
                type: 'handle_missing', fields: { VAR: 'df', METHOD: 'drop', FILL_VALUE: '0' },
                next: { block: {
                  type: 'select_columns', fields: { ACTION: 'keep', VAR: 'df', COLUMNS: 'survived, pclass, sex, age, fare' },
                  next: { block: {
                    type: 'filter_rows', fields: { VAR: 'df', COLUMN: 'age', OP: '>', VALUE: '18' },
                    next: { block: {
                      type: 'sort_data', fields: { VAR: 'df', COLUMN: 'age', ORDER: 'True' },
                      next: { block: {
                        type: 'preview_data', fields: { VAR: 'df', TYPE: 'head', N: 10 },
                        next: { block: {
                          type: 'preview_data', fields: { VAR: 'df', TYPE: 'describe', N: 5 }
                        }}
                      }}
                    }}
                  }}
                }}
              }}
            }}
          }}
        }]
      }
    };

    pandamonium.loadWorkspace(cleaningExample);

    function copyCode() {
      const code = pandamonium.generateCode();
      navigator.clipboard.writeText(code);
      alert('Code copied to clipboard!');
    }

    function clearWorkspace() {
      pandamonium.clearWorkspace();
    }
  </script>
</body>
</html>
