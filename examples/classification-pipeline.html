<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandamonium - Classification Pipeline</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="../dist/pandamonium.umd.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; color: #e94560; }
    p { margin-bottom: 20px; color: #aaa; }
    .container {
      display: flex;
      gap: 20px;
      height: calc(100vh - 120px);
    }
    #blocklyDiv {
      flex: 1;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      overflow: hidden;
    }
    .code-panel {
      width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    h3 { color: #4ecca3; margin-bottom: 10px; }
    pre {
      flex: 1;
      background: #0d1117;
      padding: 16px;
      border-radius: 8px;
      overflow: auto;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 20px;
      background: #00897B;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #00acc1; }
  </style>
</head>
<body>
  <h1>🐼 Classification Pipeline Example</h1>
  <p>This example demonstrates a complete classification workflow using the simplified high-level blocks.</p>

  <div class="container">
    <div id="blocklyDiv"></div>
    <div class="code-panel">
      <h3>Generated Python Code</h3>
      <pre id="codeOutput">Loading example...</pre>
      <div class="actions">
        <button onclick="copyCode()">📋 Copy Code</button>
        <button onclick="clearWorkspace()">🗑️ Clear</button>
      </div>
    </div>
  </div>

  <script>
    const pandamonium = new Pandamonium.Pandamonium({
      container: document.getElementById('blocklyDiv')
    });

    pandamonium.onChange((code) => {
      document.getElementById('codeOutput').textContent = code || '# No blocks yet...';
    });

    // Classification pipeline example with new high-level blocks
    const classificationExample = {
      blocks: {
        languageVersion: 0,
        blocks: [{
          type: 'comment', x: 50, y: 30, fields: { TEXT: 'Classification: Iris dataset' },
          next: { block: {
            type: 'load_data', fields: { TYPE: 'url', VAR: 'df', PATH: 'https://raw.githubusercontent.com/mwaskom/seaborn-data/master/iris.csv' },
            next: { block: {
              type: 'prepare_features', fields: { VAR: 'df', FEATURES: 'sepal_length, sepal_width, petal_length, petal_width', TARGET: 'species', X_VAR: 'X', Y_VAR: 'y' },
              next: { block: {
                type: 'split_data', fields: { X_VAR: 'X', Y_VAR: 'y', TEST_SIZE: 0.2 },
                next: { block: {
                  type: 'scale_features', fields: { SCALER: 'standard' },
                  next: { block: {
                    type: 'create_model', fields: { MODEL_TYPE: 'random_forest', MODEL_VAR: 'model', TASK: 'classifier' },
                    next: { block: {
                      type: 'train_model', fields: { MODEL_VAR: 'model' },
                      next: { block: {
                        type: 'predict', fields: { MODEL_VAR: 'model', DATA: 'X_test', PRED_VAR: 'y_pred' },
                        next: { block: {
                          type: 'evaluate', fields: { METRIC: 'accuracy', Y_TRUE: 'y_test', Y_PRED: 'y_pred' },
                          next: { block: {
                            type: 'evaluate', fields: { METRIC: 'class_report', Y_TRUE: 'y_test', Y_PRED: 'y_pred' }
                          }}
                        }}
                      }}
                    }}
                  }}
                }}
              }}
            }}
          }}
        }]
      }
    };

    pandamonium.loadWorkspace(classificationExample);

    function copyCode() {
      const code = pandamonium.generateCode();
      navigator.clipboard.writeText(code);
      alert('Code copied to clipboard!');
    }

    function clearWorkspace() {
      pandamonium.clearWorkspace();
    }
  </script>
</body>
</html>
